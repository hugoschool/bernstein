apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: worker-deployment
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-deployment
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: worker
        minAllowed:
          cpu: "50m"
          memory: "64Mi"
        maxAllowed:
          cpu: "750m"
          memory: "512Mi"
        controlledResources:
          - cpu
          - memory
