apiVersion: v1
kind: Deployment
metadata:
  name: poll-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: poll
  template:
    metadata:
      labels:
        app: poll
    spec:
      containers:
      - name: poll
        image: ffbernstein-dwffekbygbane5d9.azurecr.io/bernstein-poll:latest
        ports:
        - containerPort: 80
        env:
        - name: REDIS_HOST
          value: redis-service.default.svc.cluster.local
      imagePullSecrets:
      - name: registry-key
