apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: poll
  template:
    metadata:
      labels:
        app: poll
    spec:
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: poll
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: poll
        image: ffbernstein-dwffekbygbane5d9.azurecr.io/bernstein-poll:latest
        ports:
        - containerPort: 80
        env:
        - name: REDIS_HOST
          value: redis-service.default.svc.cluster.local

        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          failureThreshold: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /readyz
            port: 80
          failureThreshold: 30
          periodSeconds: 10

        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          failureThreshold: 30
          periodSeconds: 10

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"

      imagePullSecrets:
      - name: registry-key
