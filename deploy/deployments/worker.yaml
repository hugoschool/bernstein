apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      restartPolicy: Always
      containers:
        - name: worker
          image: ffbernstein-dwffekbygbane5d9.azurecr.io/bernstein-worker:latest
          ports:
          - containerPort: 80
          env:
            - name: REDIS_HOST
              value: redis-service.default.svc.cluster.local

            - name: POSTGRES_HOST
              value: postgresql-service.default.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: db-password

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            failureThreshold: 30
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            failureThreshold: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
      imagePullSecrets:
        - name: registry-key
