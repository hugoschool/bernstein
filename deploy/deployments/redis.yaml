apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      database: redis
  template:
    metadata:
      labels:
        database: redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.2
        ports:
        - containerPort: 6379
        # TODO: maybe add config map
        # TODO: verify if redis volumes need to use PV / PVC
        volumeMounts:
        - name: redis-storage
          mountPath: /data/redis
      volumes:
      - name: redis-storage
        emptyDir: {}
