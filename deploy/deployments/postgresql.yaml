apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      database: postgresql
  template:
    metadata:
      labels:
        database: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:18.6
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: db-password
        # TODO: maybe add config map
        volumeMounts:
          - name: postgresql-volume
            mountPath: /var/lib/postgresql
          - name: schema-volume
            # Specifying the filename here isn't needed, see example below:
            # https://kubernetes.io/docs/concepts/configuration/configmap/#configmaps-and-pods
            mountPath: /docker-entrypoint-initdb.d
            readOnly: true
      volumes:
      - name: postgresql-volume
        persistentVolumeClaim:
          claimName: postgresql-pvc
      - name: schema-volume
        configMap:
          name: db-schema
