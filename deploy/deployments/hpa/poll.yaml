apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poll-deployment
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poll-deployment
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
