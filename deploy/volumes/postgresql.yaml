apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-pv
spec:
  capacity:
    storage: 5G
  accessModes:
    - ReadWriteOnce
  # claimRef:
  #   name: postgresql-pvc
  # TODO: verify if hostPath is optimal or not
  hostPath:
    path: "/tmp/postgres-data"
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: postgresql-pv
  resources:
    requests:
      storage: 5G
  storageClassName: standard
