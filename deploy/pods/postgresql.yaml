apiVersion: v1
kind: Pod
metadata:
  name: postgresql
  labels:
    database: postgresql
spec:
  containers:
  - name: postgresql
    image: postgres:18.6
    ports:
    - containerPort: 5432
    env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-password
          key: db-password
    # TODO: maybe add config map
    volumeMounts:
      - name: postgresql-volume
        mountPath: /var/lib/postgresql
  volumes:
  - name: postgresql-volume
    persistentVolumeClaim:
      claimName: postgresql-pvc
