apiVersion: v1
kind: Pod
metadata:
  name: postgresql
spec:
  containers:
  - name: postgresql
    image: postgres:18.6
    ports:
    - containerPort: 5432
    env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-password
          key: db-password
    # TODO: add volume
    # TODO: maybe add config map
