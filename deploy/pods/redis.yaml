apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    database: redis
spec:
  restartPolicy: Always
  containers:
  - name: redis
    image: redis:8.10.2
    ports:
    - containerPort: 6379
    # TODO: maybe add config map
    # TODO: verify if redis volumes need to use PV / PVC
    volumeMounts:
    - name: redis-storage
      mountPath: /data/redis

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "750m"
  volumes:
  - name: redis-storage
    emptyDir: {}
