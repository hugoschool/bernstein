apiVersion: v1
kind: Pod
metadata:
  name: poll
  labels:
    app: poll
spec:
  containers:
  - name: poll
    image: ffbernstein-dwffekbygbane5d9.azurecr.io/bernstein-poll:latest
    ports:
    - containerPort: 80
    env:
    - name: REDIS_HOST
      value: redis-service.default.svc.cluster.local

    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      failureThreshold: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /readyz
        port: 80
      failureThreshold: 30
      periodSeconds: 10

    startupProbe:
      httpGet:
        path: /healthz
        port: 80
      failureThreshold: 30
      periodSeconds: 10
  imagePullSecrets:
  - name: registry-key
