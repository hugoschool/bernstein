apiVersion: v1
kind: Pod
metadata:
  name: worker
  labels:
    app: worker
spec:
  restartPolicy: Always
  containers:
  - name: worker
    image: ffbernstein-dwffekbygbane5d9.azurecr.io/bernstein-worker:latest
    ports:
    - containerPort: 80
    env:
      - name: REDIS_HOST
        value: redis-service.default.svc.cluster.local

      - name: POSTGRES_HOST
        value: postgresql-service.default.svc.cluster.local
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DB
        value: postgres
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-password
            key: db-password

    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      failureThreshold: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /readyz
        port: 80
      failureThreshold: 30
      periodSeconds: 10

    startupProbe:
      httpGet:
        path: /healthz
        port: 80
      failureThreshold: 30
      periodSeconds: 10

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "250m"
  imagePullSecrets:
  - name: registry-key
