apiVersion: v1
kind: Service
metadata:
  name: poll-service
spec:
  selector:
    app: poll
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: poll-load-balancer
spec:
  selector:
    app: poll
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
